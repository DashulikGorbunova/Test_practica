<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Игровой чат</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="chat">
    <header>
      <span class="badge">СТРЕКОЗА · ИГРОВОЕ ЛОББИ</span>
      <h1>Игровой чат</h1>
      <p>Поздоровайтесь с командой перед игрой</p>
    </header>
    <section class="conversation" aria-label="Переписка">
      <p id="empty-state">Пока тихо. Напишите первое сообщение!</p>
      <ul id="messages" role="log" aria-label="Сообщения" aria-live="polite"></ul>
    </section>
    <form id="message-form">
      <label for="message-input">Ваше сообщение</label>
      <div class="input-row">
        <input id="message-input" name="message" type="text" placeholder="Всем привет!" autocomplete="off">
        <button type="submit">Отправить</button>
      </div>
      <small>Enter — отправить · Сообщения исчезнут после обновления страницы</small>
    </form>
  </main>
</body>
</html>
